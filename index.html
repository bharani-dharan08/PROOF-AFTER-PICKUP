<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      // Gracefully capture and suppress WebSocket HMR disconnect notices when running in dev iframe
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
          (event.reason.message && event.reason.message.includes('WebSocket'))
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && event.message.includes('WebSocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
